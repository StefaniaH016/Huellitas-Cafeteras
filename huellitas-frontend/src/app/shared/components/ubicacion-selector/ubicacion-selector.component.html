<fieldset class="zone-fields" [class.stacked]="stacked">
  <legend>Zona</legend>
  <div class="grid-3">
    <div class="form-field">
      <label [for]="idPrefix + '-depto-sel'">Departamento</label>
      <select
        #deptoSelect
        [id]="idPrefix + '-depto-sel'"
        [ngModel]="selectedDeptoId()"
        (change)="onDeptoChange(deptoSelect.value)"
        [disabled]="cargandoDepartamentos || !!errorDepartamentos"
        [attr.aria-describedby]="errorDepartamentos ? idPrefix + '-depto-error' : null"
      >
        <option value="">
          {{
            cargandoDepartamentos
              ? 'Cargando departamentos...'
              : errorDepartamentos
                ? 'No se pudieron cargar los departamentos'
                : departamentos.length
                  ? 'Selecciona el departamento'
                  : 'No hay departamentos disponibles'
          }}
        </option>
        @for (depto of departamentos; track depto.id) {
          <option [value]="depto.id">
            {{ depto.nombre }}
          </option>
        }
      </select>
      @if (errorDepartamentos) {
        <p class="field-error" [id]="idPrefix + '-depto-error'" role="alert">
          {{ errorDepartamentos }}
          <button type="button" class="btn btn-ghost" (click)="loadDepartamentos()">
            Reintentar
          </button>
        </p>
      }
    </div>
    <div class="form-field">
      <label [for]="idPrefix + '-mun-sel'">Municipio</label>
      <select
        #munSelect
        [id]="idPrefix + '-mun-sel'"
        [ngModel]="selectedMunId()"
        (change)="onMunChange(munSelect.value)"
        [disabled]="!selectedDeptoId() || cargandoMunicipios || !!errorMunicipios"
        [attr.aria-describedby]="errorMunicipios ? idPrefix + '-mun-error' : null"
      >
        <option value="">
          {{
            !selectedDeptoId()
              ? 'Primero elige el departamento'
              : cargandoMunicipios
                ? 'Cargando municipios...'
                : errorMunicipios
                  ? 'No se pudieron cargar los municipios'
                  : municipios.length
                    ? 'Selecciona el municipio'
                    : 'No hay municipios disponibles'
          }}
        </option>
        @for (mun of municipios; track mun.id) {
          <option [value]="mun.id">
            {{ mun.nombre }}
          </option>
        }
      </select>
      @if (errorMunicipios) {
        <p class="field-error" [id]="idPrefix + '-mun-error'" role="alert">
          {{ errorMunicipios }}
          <button type="button" class="btn btn-ghost" (click)="reintentarMunicipios()">
            Reintentar
          </button>
        </p>
      }
    </div>
    <div class="form-field">
      <label [for]="idPrefix + '-barrio-sel'">Barrio</label>
      <select
        #barrioSelect
        [id]="idPrefix + '-barrio-sel'"
        [ngModel]="selectedBarrioId()"
        (change)="onBarrioChange(barrioSelect.value)"
        [disabled]="!selectedMunId() || cargandoBarrios || !!errorBarrios"
        [attr.aria-describedby]="errorBarrios ? idPrefix + '-barrio-error' : null"
      >
        <option value="">
          {{
            !selectedMunId()
              ? 'Primero elige el municipio'
              : cargandoBarrios
                ? 'Cargando barrios...'
                : errorBarrios
                  ? 'No se pudieron cargar los barrios'
                  : barrios.length
                    ? 'Selecciona el barrio'
                    : 'No hay barrios disponibles'
          }}
        </option>
        @for (barrio of barrios; track barrio.id) {
          <option [value]="barrio.id">
            {{ barrio.nombre }}
          </option>
        }
      </select>
      @if (errorBarrios) {
        <p class="field-error" [id]="idPrefix + '-barrio-error'" role="alert">
          {{ errorBarrios }}
          <button type="button" class="btn btn-ghost" (click)="reintentarBarrios()">
            Reintentar
          </button>
        </p>
      }
    </div>
  </div>
</fieldset>
