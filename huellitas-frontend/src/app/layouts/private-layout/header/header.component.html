<header class="site-header">
  <div class="header-main">
    <a class="brand" routerLink="/">
      <div class="brand-mark" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="var(--color-primary)">
          <ellipse cx="12" cy="15.5" rx="5.4" ry="4.6" />
          <ellipse cx="5.6" cy="9.2" rx="2.1" ry="2.6" />
          <ellipse cx="10.2" cy="5.6" rx="2.1" ry="2.7" />
          <ellipse cx="14.8" cy="5.6" rx="2.1" ry="2.7" />
          <ellipse cx="18.4" cy="9.2" rx="2.1" ry="2.6" />
        </svg>
      </div>
      <span class="brand-name">Huellitas Cafeteras</span>
    </a>
    <nav class="header-nav" aria-label="Navegación principal">
      <a routerLink="/mis-reportes" class="nav-link">Mis reportes</a>
      <a routerLink="/mensajes" class="nav-link">
        Mensajes
        <span class="badge" aria-label="2 mensajes nuevos">2</span>
      </a>
      <a routerLink="/notificaciones" class="nav-link">
        Notificaciones
        <span class="badge" aria-label="3 notificaciones nuevas">3</span>
      </a>
    </nav>
    <div class="user-area">
      <div class="user-chip">
        <div class="avatar" aria-hidden="true">{{ initials() }}</div>
        <span class="user-name">{{ userName() }}</span>
      </div>
      <button class="btn-salir" (click)="logout()" type="button">Salir</button>
    </div>
  </div>
</header>
