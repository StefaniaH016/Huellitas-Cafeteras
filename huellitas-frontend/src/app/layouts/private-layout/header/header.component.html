<header class="site-header">
  <div class="header-main">
    <a class="brand" routerLink="/">
      <div class="brand-mark" aria-hidden="true">
        <img src="huellitas-cafeteras-icono.png" alt="" />
      </div>
      <span class="brand-name"><span>Huellitas</span><span>Cafeteras</span></span>
    </a>
    <nav class="header-nav" aria-label="Navegación principal">
      <!-- Inicio link for all roles -->
      @if (!isAdmin()) {
        <a routerLink="/home" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z" />
          </svg>
          Inicio
        </a>
      }

      <!-- Show "Mi panel" for non-ciudadano roles -->
      @if (isFundacion() || isVeterinaria()) {
        <a routerLink="/home" fragment="mi-panel" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" />
          </svg>
          Mi panel
        </a>
      }
      @if (isAdmin()) {
        <a routerLink="/admin" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" />
          </svg>
          Panel
        </a>
      }

      <!-- Show "Mis reportes" for ciudadano -->
      @if (isCiudadano()) {
        <a routerLink="/mis-reportes" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="4" width="14" height="17" rx="2.5" />
            <path d="M9 4.5V3.5h6v1M9 11h6M9 15h4" />
          </svg>
          Mis reportes
        </a>
      }
    </nav>
    <div class="user-area">
      <a routerLink="/notificaciones" class="nav-link">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z" />
          <path d="M10 20a2 2 0 0 0 4 0" />
        </svg>
        Notificaciones
        <span class="badge" aria-label="3 notificaciones nuevas">3</span>
      </a>
      <div class="user-chip">
        <div class="avatar" aria-hidden="true">{{ initials() }}</div>
        <span class="user-name">{{ userName() }}</span>
      </div>
      <button class="btn-salir" (click)="logout()" type="button">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3" />
          <path d="m16 17 5-5-5-5M21 12H9" />
        </svg>
        Salir
      </button>
    </div>
  </div>
</header>
