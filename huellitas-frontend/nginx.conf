server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Ensure UTF-8 encoding for HTML files
    location ~* \.html?$ {
        add_header Content-Type "text/html; charset=utf-8";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
