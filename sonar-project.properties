# ============================================
# Configuración SonarCloud - Huellitas Cafeteras
# Estrategia de Pruebas y Cobertura (ADR-010)
# ============================================

# Identidad del Proyecto
sonar.organization=stefaniah016
sonar.projectKey=StefaniaH016_Huellitas-Cafeteras
sonar.projectName=Huellitas Cafeteras

# Estructura - Código Fuente
sonar.sources=huellitas-backend/src/main,huellitas-frontend/src
sonar.tests=huellitas-backend/src/test,huellitas-frontend/src

# Incluciones de Pruebas
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*Test.java,**/*Tests.java

# Rutas de Reportes de Cobertura
sonar.coverage.jacoco.xmlReportPaths=huellitas-backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=huellitas-frontend/coverage/huellitas-frontend/lcov.info

# Binarios Java (necesarios para análisis)
sonar.java.binaries=huellitas-backend/target/classes

# ESLint - Reporte JSON (cuando se genere)
sonar.externalIssuesReportPaths=huellitas-frontend/eslint-report.json

# Cobertura - Configuración Progresiva (sin bloqueos aún)
# Se activará en FASE 2 cuando el Quality Gate esté listo
# sonar.qualitygate.wait=true

# Exclusiones - Archivos que NO analizar
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/*.test.ts
