spring.application.name=huellitas

# Configuración de Base de Datos para Pruebas
# Si las variables de entorno están definidas (CI/CD), se usan
# Si no, se deshabilita la auto-configuración de DataSource para pruebas locales
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USER:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:}

# Si no hay datasource configurado, desabilitar auto-config
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
