# ========================================
# Configuración - Railway
# ========================================

spring:
  application:
    name: huellitas

  # ── Base de datos PostgreSQL (Railway) ─────────────────────────
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA / Hibernate ────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false

  # ── Docker Compose & DevTools ─────────────────────────────────
  docker:
    compose:
      enabled: false
  devtools:
    restart:
      enabled: false

  # ── CORS - Permitir requests desde Vercel, Railway y localhost ──
  web:
    cors:
      allowed-origins: https://huellitas-cafeteras.vercel.app,https://*.vercel.app,https://*.railway.app,http://localhost:4200
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600

# ── Servidor ───────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /
  http2:
    enabled: true

# ── JWT ────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

# ── Cloudinary ─────────────────────────────────────────────────
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# ── Actuator ───────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      livenessState:
        enabled: true
      readinessState:
        enabled: true
  health:
    db:
      enabled: true

# ── Logging (debug para HTTP requests) ──────────────────────────
logging:
  level:
    root: INFO
    co.edu.uniquindio.huellitas: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
    org.springframework.web: DEBUG
    org.springframework.security.web.FilterChainProxy: DEBUG
