# ========================================
# Configuración - Railway
# ========================================

spring:
  application:
    name: huellitas

  # ── Base de datos PostgreSQL (Railway) ─────────────────────────
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:huellitas_db}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA / Hibernate ────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false

  # ── Docker Compose & DevTools ─────────────────────────────────
  docker:
    compose:
      enabled: false
  devtools:
    restart:
      enabled: false

  # ── CORS - Permitir requests desde Postman y frontend ─────────
  web:
    cors:
      allowed-origins: "*"
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
      allowed-headers: "*"
      allow-credentials: false
      max-age: 3600

# ── Servidor ───────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /api
  http2:
    enabled: true

# ── JWT ────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}

# ── Cloudinary ─────────────────────────────────────────────────
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:huellitas_local}
  api-key: ${CLOUDINARY_API_KEY:123456789012345}
  api-secret: ${CLOUDINARY_API_SECRET:abcde12345secret}

# ── Actuator ───────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      livenessState:
        enabled: true
      readinessState:
        enabled: true
  health:
    db:
      enabled: true

# ── Logging (debug para HTTP requests) ──────────────────────────
logging:
  level:
    root: INFO
    co.edu.uniquindio.huellitas: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
    org.springframework.web: DEBUG
    org.springframework.security.web.FilterChainProxy: DEBUG
