name: Docker Push to Hub

on:
  push:
    branches:
      - main
    paths:
      - 'huellitas-backend/**'
      - 'huellitas-frontend/**'
      - '.github/workflows/docker-push.yml'
      - 'compose.yaml'
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # GATE: esperar que el SQA pase antes de deployar
  # ─────────────────────────────────────────────
  wait-for-sqa:
    name: Wait for SQA Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Wait for SQA checks
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Backend - Tests + Checkstyle + SonarCloud'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20

      - name: Wait for Frontend SQA checks
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Frontend - ESLint + Tests + SonarCloud'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20

  # ─────────────────────────────────────────────
  # BUILD & PUSH con tags versionados
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: wait-for-sqa
    strategy:
      matrix:
        service:
          - name: backend
            dockerfile: ./huellitas-backend/Dockerfile
            context: .
          - name: frontend
            dockerfile: ./huellitas-frontend/Dockerfile
            context: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Guardar la imagen :stable actual como respaldo antes de sobreescribir :latest
      - name: Pull current :latest as :stable backup
        run: |
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/huellitas-${{ matrix.service.name }}:latest || true
          docker tag  ${{ secrets.DOCKER_HUB_USERNAME }}/huellitas-${{ matrix.service.name }}:latest \
                      ${{ secrets.DOCKER_HUB_USERNAME }}/huellitas-${{ matrix.service.name }}:stable || true
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/huellitas-${{ matrix.service.name }}:stable || true

      # Build y push con tres tags: sha exacto, latest y fecha
      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/huellitas-${{ matrix.service.name }}:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/huellitas-${{ matrix.service.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # HEALTHCHECK + ROLLBACK AUTOMÁTICO
  # ─────────────────────────────────────────────
  healthcheck-and-rollback:
    name: Healthcheck & Rollback on Failure
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Wait for Azure to redeploy (60s)
        run: sleep 60

      - name: Healthcheck backend
        id: health
        run: |
          if [ -z "${{ secrets.AZURE_BACKEND_URL }}" ]; then
            echo "⚠️ AZURE_BACKEND_URL no configurado. Saltando healthcheck."
            exit 0
          fi
          STATUS="000"
          for i in {1..8}; do
            STATUS=$(curl --silent --max-time 15 --write-out "%{http_code}" --output /dev/null \
              "${{ secrets.AZURE_BACKEND_URL }}/actuator/health" || echo "000")
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              break
            fi
            sleep 10
          done
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" != "200" ]; then
            echo "❌ Healthcheck falló con HTTP $STATUS tras varios intentos"
            exit 1
          fi
          echo "✅ Healthcheck OK (HTTP $STATUS)"

      - name: Rollback – re-push imagen estable anterior
        if: failure() && steps.health.conclusion == 'failure'
        run: |
          echo "🔄 Iniciando rollback: restaurando imagen :stable como :latest..."
          echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login \
            --username "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

          for SERVICE in backend frontend; do
            IMAGE="${{ secrets.DOCKER_HUB_USERNAME }}/huellitas-${SERVICE}"
            docker pull "${IMAGE}:stable"
            docker tag  "${IMAGE}:stable" "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
            echo "✅ Rollback de ${SERVICE} completado"
          done

      - name: Notify rollback result
        if: failure()
        run: |
          echo "::error::🚨 Deploy fallido. Se ejecutó rollback automático a la imagen :stable anterior."
          echo "::error::Revisar logs de Azure y el healthcheck de ${{ secrets.AZURE_BACKEND_URL }}/actuator/health"
