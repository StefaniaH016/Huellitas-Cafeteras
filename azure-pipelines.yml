trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'
  
variables:
  azureARMConnection: 'azure-connection'
  containerRegistry: 'acrhuellitascafeteras.azurecr.io'
  imageRepository: 'huellitas-cafeteras'
  webAppName: 'huellitas-cafeteras-prod'
  dockerRegistryServiceConnection: 'docker-registry-connection'
  tag: '$(Build.BuildId)'

stages:
  - stage: BuildAndPush
    displayName: 'Build and Push Docker Image to ACR'
    jobs:
      - job: Build
        displayName: 'Build and Push'
        steps:
          - task: Docker@2
            displayName: 'Build and push image to ACR'
            inputs:
              command: 'buildAndPush'
              Dockerfile: '$(Build.SourcesDirectory)/huellitas-backend/Dockerfile'
              repository: '$(imageRepository)'
              containerRegistry: '$(dockerRegistryServiceConnection)'
              tags: |
                $(tag)
                latest

  - stage: Deploy
    displayName: 'Deploy to Azure App Service'
    dependsOn: BuildAndPush
    condition: succeeded()
    jobs:
      - job: Deploy
        displayName: 'Deploy Container'
        steps:
          - task: AzureWebAppContainer@1
            displayName: 'Deploy to Azure App Service'
            inputs:
              azureSubscription: '$(azureARMConnection)'
              appName: '$(webAppName)'
              containers: '$(containerRegistry)/$(imageRepository):$(tag)'
