version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: huellitas-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - huellitas-network

  backend:
    build:
      context: ./huellitas-backend
      dockerfile: Dockerfile
    container_name: huellitas-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - '8080:8080'
    depends_on:
      - postgres
    networks:
      - huellitas-network

  frontend:
    build:
      context: ./huellitas-frontend
      dockerfile: Dockerfile
    container_name: huellitas-web
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - huellitas-network

volumes:
  postgres_data:

networks:
  huellitas-network:
    driver: bridge
